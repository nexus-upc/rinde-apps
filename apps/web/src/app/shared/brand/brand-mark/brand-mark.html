<span class="brand-mark">
  <svg
    class="brand-mark__logo"
    [attr.viewBox]="logo.viewBox"
    [attr.width]="width()"
    [attr.height]="size()"
    aria-hidden="true"
    focusable="false"
  >
    <path fill="currentColor" fill-rule="evenodd" [attr.d]="logo.d" />
  </svg>
  <span class="visually-hidden">Rinde</span>
</span>
