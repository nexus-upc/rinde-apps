<dialog
  #dialog
  class="confirm-dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="messageId"
  tabindex="-1"
  (cancel)="onCancel($event)"
  (click)="onBackdrop($event)"
  (keydown)="onKeydown($event)"
>
  <div class="confirm-dialog__surface">
    <header class="confirm-dialog__header">
      <h2 [id]="titleId" class="confirm-dialog__title">{{ title() }}</h2>
      <button
        type="button"
        class="confirm-dialog__close"
        aria-label="Cerrar diálogo"
        [disabled]="pending()"
        (click)="requestCancel()"
      >
        &times;
      </button>
    </header>

    <div class="confirm-dialog__body">
      <p [id]="messageId" class="confirm-dialog__message">{{ message() }}</p>

      @if (error(); as errorMessage) {
        <p class="form-alert" role="alert">{{ errorMessage }}</p>
      }

      <ng-content />
    </div>

    <footer class="confirm-dialog__footer">
      <button
        #cancelButton
        uiButton
        variant="secondary"
        type="button"
        class="confirm-dialog__action"
        [disabled]="pending()"
        (click)="requestCancel()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        uiButton
        variant="primary"
        type="button"
        class="confirm-dialog__action"
        [loading]="pending()"
        (click)="confirmed.emit()"
      >
        {{ confirmLabel() }}
      </button>
    </footer>
  </div>
</dialog>
