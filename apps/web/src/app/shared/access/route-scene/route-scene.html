<svg
  class="route-scene__map"
  viewBox="0 0 808 868"
  preserveAspectRatio="xMidYMid slice"
  focusable="false"
>
  <defs>
    <pattern id="route-scene-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" class="route-scene__dot" />
    </pattern>
  </defs>
  <rect width="808" height="868" fill="url(#route-scene-dots)" />
  <path class="route-scene__road" [attr.d]="route" />
  <path class="route-scene__lanes" [attr.d]="route" />
  <path class="route-scene__line" [attr.d]="route" />
  <circle class="route-scene__stop" cx="150" cy="330" r="7" />
  <circle class="route-scene__stop" cx="380" cy="520" r="7" />
  <circle class="route-scene__pulse" cx="640" cy="720" r="7" />
  <circle class="route-scene__end" cx="640" cy="720" r="9" />
  <text class="route-scene__city" x="128" y="306">Lima</text>
  <text class="route-scene__city" x="398" y="512">Ica</text>
  <text class="route-scene__city" x="600" y="760">Arequipa</text>
  @if (reducedMotion()) {
    <g class="route-scene__unit" transform="translate(640 720)">
      <circle r="12" />
      <path d="M-6 -2h7v6h-7z M1 0h3l2 2v2h-5z" />
    </g>
  } @else {
    <g class="route-scene__unit">
      <circle r="12" />
      <path d="M-6 -2h7v6h-7z M1 0h3l2 2v2h-5z" />
      <animateMotion dur="7s" repeatCount="indefinite" begin="2.6s" [attr.path]="route" />
    </g>
  }
</svg>

<div class="route-scene__trip">
  <div class="route-scene__trip-head">
    <span class="route-scene__code">TRP-000124</span>
    <span class="route-scene__status">En ruta</span>
  </div>
  <span class="route-scene__route">Lima a Arequipa</span>
  <span class="route-scene__bar"><span></span></span>
  <div class="route-scene__trip-foot">
    <span>Unidad ABC-123</span>
    <span>Llega mañana</span>
  </div>
</div>
