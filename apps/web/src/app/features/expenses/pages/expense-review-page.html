<div class="expenses-inbox">
  <app-page-header
    title="Bandeja de gastos"
    description="Revisa todos los comprobantes de la empresa desde un solo listado, sin buscar identificadores internos."
  >
    @if (store.headerBadgeLabel()) {
      <app-status-badge
        [tone]="store.statusFilter() === 'REGISTERED,PENDING_SUPPORT' ? 'wait' : 'neutral'"
        [label]="store.headerBadgeLabel()"
      />
    }
  </app-page-header>

  <app-filter-bar
    ariaLabel="Filtros de gastos"
    [canClear]="store.hasActiveFilters()"
    (cleared)="onClearFilters()"
  >
    <label class="field">
      <span class="field__label">Estado</span>
      <select class="field__select" [value]="store.statusFilter()" (change)="onStatusChange($event)">
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === store.statusFilter()">
            {{ option.label }}
          </option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Viaje</span>
      <select class="field__select" [value]="store.tripIdFilter()" (change)="onTripChange($event)">
        <option value="" [selected]="store.tripIdFilter() === ''">Todos los viajes</option>
        @if (store.tripIdFilter() && !store.tripLabelsById()[store.tripIdFilter()]) {
          <option [value]="store.tripIdFilter()" selected>Viaje seleccionado</option>
        }
        @for (trip of store.trips(); track trip.id) {
          <option [value]="trip.id" [selected]="trip.id === store.tripIdFilter()">
            {{ store.tripLabelsById()[trip.id] }}
          </option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Conductor</span>
      <select
        class="field__select"
        [value]="store.driverIdFilter()"
        (change)="onDriverChange($event)"
      >
        <option value="" [selected]="store.driverIdFilter() === ''">Todos los conductores</option>
        @for (driver of store.selectableDrivers(); track driver.id) {
          <option [value]="driver.userId" [selected]="driver.userId === store.driverIdFilter()">
            {{ driver.fullName }}
          </option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Desde</span>
      <input
        class="field__input"
        type="date"
        [value]="store.fromFilter()"
        (change)="onFromChange($event)"
      />
    </label>

    <label class="field">
      <span class="field__label">Hasta</span>
      <input
        class="field__input"
        type="date"
        [value]="store.toFilter()"
        (change)="onToChange($event)"
      />
    </label>
  </app-filter-bar>

  @if (store.state() === 'loading') {
    <section class="inbox-loading" role="status" aria-live="polite">
      <div class="inbox-loading__skeleton" aria-hidden="true">
        <span class="inbox-loading__bar inbox-loading__bar--wide"></span>
        <span class="inbox-loading__bar"></span>
        <span class="inbox-loading__bar inbox-loading__bar--short"></span>
      </div>
      <h2>Cargando gastos de la empresa</h2>
      <p>Obteniendo gastos y comprobantes adjuntos.</p>
    </section>
  } @else if (store.state() === 'error') {
    <app-state-panel
      title="No pudimos cargar la bandeja"
      [message]="store.error()"
      actionLabel="Reintentar"
      [error]="true"
      (action)="retry()"
    >
      !
    </app-state-panel>
  } @else if (store.expenses().length === 0) {
    <app-state-panel
      title="Sin gastos para estos filtros"
      message="Ningún gasto coincide con el estado, viaje, conductor o fechas elegidas. Limpia los filtros para ver toda la bandeja."
      [actionLabel]="store.hasActiveFilters() ? 'Limpiar filtros' : ''"
      (action)="onClearFilters()"
    >
      0
    </app-state-panel>
  } @else {
    <div class="inbox-grid">
      <section class="inbox-grid__list" aria-label="Listado y paginación de gastos">
        <app-expense-table
          [expenses]="store.expenses()"
          [selectedExpenseId]="store.selectedExpense()?.id ?? null"
          [tripCodes]="store.tripCodesById()"
          [driverNames]="store.driverNamesByUserId()"
          (expenseSelected)="onSelectExpense($event)"
        />

        <app-pagination
          ariaLabel="Paginación de gastos"
          [page]="store.page()"
          [size]="store.size()"
          [totalItems]="store.totalItems()"
          [disabled]="store.busy()"
          (pageChange)="onPageChange($event)"
        />
      </section>

      <app-expense-detail-panel
        [expense]="store.selectedExpense()"
        [tripCode]="selectedTripCode()"
        [driverName]="selectedDriverName()"
        [evidenceUrl]="store.evidenceUrl()"
        [evidenceState]="store.evidenceState()"
        [busy]="store.busy()"
        [actionError]="store.actionError()"
        (approveRequested)="onRequestApprove($event)"
        (observeRequested)="onObserve($event)"
      />
    </div>
  }

  <app-confirm-dialog
    [open]="pendingApproval() !== null"
    title="Aprobar gasto seleccionado"
    [message]="approveDialogMessage()"
    confirmLabel="Confirmar aprobación"
    cancelLabel="Cancelar"
    [pending]="store.busy()"
    [error]="store.actionError() || null"
    (confirmed)="onConfirmApprove()"
    (cancelled)="onCancelApprove()"
  />
</div>
