<div class="expense-review-page">
  <app-page-header
    title="Revisión y Resumen de Gastos"
    description="Auditoría, aprobación, observación y resumen por estado de comprobantes del viaje."
  >
    <div class="header-actions">
      @if (store.tripId()) {
        <a
          uiButton
          variant="secondary"
          [routerLink]="['/settlements']"
          [queryParams]="{ tripId: store.tripId() }"
        >
          Ver liquidación
        </a>
      }
      <button uiButton variant="secondary" type="button" (click)="goBack()">
        Volver a Viajes
      </button>
    </div>
  </app-page-header>

  <section class="trip-search-bar">
    <label for="trip-search-input" class="search-label">ID del Viaje:</label>
    <div class="search-input-group">
      <input
        id="trip-search-input"
        type="text"
        class="search-input"
        placeholder="Ejemplo: 3fa85f64-5717-4562-b3fc-2c963f66afa6"
        [ngModel]="inputTripId()"
        (ngModelChange)="inputTripId.set($event)"
        (keyup.enter)="searchTrip()"
      />
      <button
        uiButton
        variant="primary"
        type="button"
        [disabled]="!inputTripId().trim() || store.state() === 'loading'"
        (click)="searchTrip()"
      >
        Buscar Gastos
      </button>
    </div>
  </section>

  @if (store.state() === 'loading') {
    <app-state-panel
      title="Cargando comprobantes"
      message="Obteniendo la lista de gastos registrados para el viaje..."
    />
  } @else if (store.state() === 'error') {
    <app-state-panel
      [error]="true"
      title="Error al consultar gastos"
      [message]="store.error()"
      actionLabel="Reintentar"
      (action)="retry()"
    />
  } @else if (store.state() === 'ready') {
    <app-expense-trip-summary [summary]="store.tripSummary()" />

    <section class="table-section">
      <app-expense-table
        [expenses]="store.expenses()"
        [busy]="store.busy()"
        (reviewExpense)="onReviewExpense($event)"
        (quickApprove)="onQuickApprove($event)"
      />
    </section>
  } @else {
    <div class="idle-placeholder">
      <p>Ingresa el identificador de un viaje para comenzar la revisión de comprobantes.</p>
    </div>
  }

  <app-expense-review-modal
    [expense]="store.selectedExpense()"
    [busy]="store.busy()"
    [actionError]="store.actionError()"
    [evidenceUrl]="store.evidenceUrl()"
    [evidenceState]="store.evidenceState()"
    (closeModal)="onCloseModal()"
    (approve)="onApprove($event)"
    (observe)="onObserve($event)"
    (clearError)="store.clearActionError()"
  />
</div>
