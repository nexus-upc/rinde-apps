<app-data-table ariaLabel="Listado de gastos">
  <table class="arc-table">
    <thead>
      <tr>
        <th scope="col">Fecha</th>
        <th scope="col">Viaje</th>
        <th scope="col">Conductor</th>
        <th scope="col">Categoría</th>
        <th scope="col">Estado</th>
        <th scope="col" class="arc-table__num">Monto</th>
      </tr>
    </thead>
    <tbody>
      @for (item of expenses(); track item.id) {
        <tr
          class="expense-row"
          tabindex="0"
          [class.is-selected]="item.id === selectedExpenseId()"
          [attr.aria-selected]="item.id === selectedExpenseId()"
          (click)="selectRow(item)"
          (keydown)="onRowKeydown($event, item)"
        >
          <td data-label="Fecha" class="expense-row__date">
            {{ formatExpenseDate(item.expenseDate) }}
          </td>
          <td data-label="Viaje" class="expense-row__trip">
            {{ resolveTripCode(item.tripId) }}
          </td>
          <td data-label="Conductor">
            {{ resolveDriverName(item.driverId) }}
          </td>
          <td data-label="Categoría" class="expense-row__nowrap">
            {{ getCategoryLabel(item.category) }}
          </td>
          <td data-label="Estado">
            <app-status-badge [tone]="getStatusTone(item)" [label]="getStatusLabel(item)" />
          </td>
          <td data-label="Monto" class="arc-table__num expense-row__nowrap">
            {{ formatExpenseAmount(item.amount, item.currency) }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-data-table>
