<section class="fleet" aria-labelledby="fleet-title">
  <app-page-header
    title="Flota y Mantenimiento"
    titleId="fleet-title"
    [count]="store.state() === 'ready' ? store.countLabel() : ''"
  >
    <div class="fleet__header-actions">
      <button
        uiButton
        variant="secondary"
        type="button"
        [disabled]="store.state() !== 'ready' || store.vehicles().length === 0"
        (click)="onRecordRequested()"
      >
        Registrar mantenimiento
      </button>

      @if (!store.creating()) {
        <button
          #createTrigger
          uiButton
          type="button"
          [disabled]="store.state() !== 'ready'"
          (click)="store.openCreate()"
        >
          Registrar vehículo
        </button>
      }
    </div>
  </app-page-header>

  @if (store.creating()) {
    <app-vehicle-form
      [pending]="store.createAction.pending()"
      [error]="store.createAction.error()"
      (submitted)="store.createVehicle($event)"
      (cancelled)="closeCreate()"
    />
  }

  @if (store.recordingMaintenance()) {
    <app-maintenance-form
      [vehicles]="store.vehicles()"
      [preselectedVehicleId]="store.preselectedVehicleId()"
      [pending]="store.recordAction.pending()"
      [error]="store.recordAction.error()"
      (submitted)="store.recordMaintenance($event)"
      (cancelled)="store.closeRecordMaintenance()"
    />
  }

  <div class="fleet__nav" role="tablist" aria-label="Secciones de flota">
    <button
      class="nav-tab"
      role="tab"
      type="button"
      [class.nav-tab--active]="store.activeTab() === 'vehicles'"
      [attr.aria-selected]="store.activeTab() === 'vehicles'"
      (click)="store.setTab('vehicles')"
    >
      Vehículos ({{ store.vehicles().length }})
    </button>

    <button
      class="nav-tab"
      role="tab"
      type="button"
      [class.nav-tab--active]="store.activeTab() === 'alerts'"
      [attr.aria-selected]="store.activeTab() === 'alerts'"
      (click)="store.setTab('alerts')"
    >
      Alertas de Mantenimiento
      @if (store.alertsCount() > 0) {
        <span class="nav-tab__badge">{{ store.alertsCount() }}</span>
      }
    </button>
  </div>

  @switch (store.state()) {
    @case ('loading') {
      @if (store.activeTab() === 'vehicles') {
        <app-vehicle-list [loading]="true" />
      } @else {
        <app-maintenance-alert-list [loading]="true" />
      }
    }
    @case ('error') {
      <app-state-panel
        title="No se pudo cargar la flota"
        [message]="store.error() ?? 'Revisa tu conexión e inténtalo otra vez.'"
        [error]="true"
        actionLabel="Reintentar"
        (action)="store.load()"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v5M12 16h.01" />
        </svg>
      </app-state-panel>
    }
    @default {
      @if (store.activeTab() === 'vehicles') {
        <app-vehicle-list
          [vehicles]="store.vehicles()"
          (vehicleSelected)="store.openVehicleDetail($event)"
        />
      } @else {
        <app-maintenance-alert-list
          [alerts]="store.alerts()"
          (recordRequested)="onRecordRequested($event)"
        />
      }
    }
  }

  <app-vehicle-detail-modal
    [vehicle]="store.selectedVehicle()"
    [health]="store.selectedHealth()"
    [healthLoading]="store.healthLoadState() === 'loading'"
    [healthError]="store.healthError()"
    (closeModal)="store.closeVehicleDetail()"
    (recordMaintenanceRequested)="onRecordRequested($event)"
  />
</section>
